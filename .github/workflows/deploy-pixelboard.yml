# Infinite Pixelboard production deploys now happen on Render.
#
# The Render service (srv-da55t78u01pc73e3rlu0) auto-deploys from `main`
# whenever this repo pushes. There is nothing to orchestrate here.
#
# This workflow previously drove the Azure Container Apps pipeline
# (ACR build + ARM deploy). That stack is retired; see apps/render.yaml
# and README.md "Deployments" for the current architecture.
name: Deploy Infinite Pixelboard (Render)

on:
  workflow_dispatch:

jobs:
  noop:
    name: Deploys are automatic on Render
    runs-on: ubuntu-latest
    steps:
      - name: Explain
        run: |
          echo "Infinite Pixelboard deploys automatically via Render on push to main."
          echo "No GitHub Actions deployment steps are required."
