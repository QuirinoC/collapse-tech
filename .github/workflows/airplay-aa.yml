name: Validate AirPlay AA bridge

"on":
  pull_request:
    paths:
      - apps/airplay-aa-bridge/**
      - .github/workflows/airplay-aa.yml
  push:
    branches: [main]
    paths:
      - apps/airplay-aa-bridge/**
      - .github/workflows/airplay-aa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    name: Python and production TLS regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/airplay-aa-bridge
    steps:
      - uses: actions/checkout@v5
      - name: Install video test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-bad
      - name: Run Python regressions
        env:
          AIRPLAY_AA_REQUIRE_VIDEO_TESTS: "1"
        run: python3 -m unittest discover -s tests -v
      - name: Run production TLS peer regression
        run: ./scripts/test-tls-local.sh
