name: Validate applications

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  challenge:
    name: Challenge
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/asymmetric-challenge
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: .
      - run: npm run lint
      - run: npm test
      - run: SECRET_KEY_HEX=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef npm run build

  studio:
    name: Studio
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/collapse-technologies
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: .
      - run: npm run lint
      - run: npm run build

  collapse-health:
    name: Collapse Health
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/collapse-health
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: .
      - run: npm run lint
      - run: npm test
      - run: npm run build

  dress-like-me:
    name: Dress Like Me
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dress-like-me
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: .
      - run: npm run lint
      - run: npm test
      - run: npm run build

  coach:
    name: CoachGG
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: apps/coach-gg
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: apps/coach-gg/src/CoachGG.csproj
      - run: dotnet restore tests/CoachGG.Tests/CoachGG.Tests.csproj
      - run: dotnet format src/CoachGG.csproj --verify-no-changes --no-restore
      - run: COACHGG_TEST_REDIS=localhost:6379 dotnet test tests/CoachGG.Tests/CoachGG.Tests.csproj --configuration Release --no-restore
      - run: dotnet build src/CoachGG.csproj --configuration Release --no-restore
      - name: Build production container
        run: docker build --tag coach-gg-ci:${{ github.sha }} .
      - name: Verify production container is non-root
        run: test -n "$(docker image inspect coach-gg-ci:${{ github.sha }} --format '{{.Config.User}}')"

  pixelboard:
    name: Infinite Pixelboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/infinite-pixelboard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: apps/infinite-pixelboard/PixelBoard.csproj
      - run: dotnet restore PixelBoard.sln
      - run: dotnet format PixelBoard.sln --verify-no-changes --no-restore
      - run: dotnet test PixelBoard.sln --no-restore
      - run: dotnet build PixelBoard.sln --no-restore
      - name: Build production container
        run: docker build --tag pixelboard-ci:${{ github.sha }} .
      - name: Verify production container is non-root
        run: test -n "$(docker image inspect pixelboard-ci:${{ github.sha }} --format '{{.Config.User}}')"
