name: Validate applications

on:
  push:
    branches: [main]
  pull_request:

jobs:
  challenge:
    name: Challenge
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/asymmetric-challenge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/asymmetric-challenge/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: SECRET_KEY_HEX=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef npm run build

  studio:
    name: Studio
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/collapse-technologies
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/collapse-technologies/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  dress-like-me:
    name: Dress Like Me
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dress-like-me
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/dress-like-me/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  pixelboard:
    name: Infinite Pixelboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/infinite-pixelboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: apps/infinite-pixelboard/PixelBoard.csproj
      - run: dotnet restore PixelBoard.sln
      - run: dotnet format PixelBoard.sln --verify-no-changes --no-restore
      - run: dotnet test PixelBoard.sln --no-restore
      - run: dotnet build PixelBoard.sln --no-restore
