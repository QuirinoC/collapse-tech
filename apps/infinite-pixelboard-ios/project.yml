name: InfinitePixelboard
options:
  bundleIdPrefix: com.collapse
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    CODE_SIGN_STYLE: Automatic
packages:
  PixelboardCore:
    path: .
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 11.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: 8.0.0
targets:
  InfinitePixelboard:
    type: application
    platform: iOS
    sources:
      - path: Sources/InfinitePixelboardApp
      - path: Resources
        buildPhase: resources
        excludes:
          - InfinitePixelboard.storekit
          - Fonts/OFL-*.txt
      - path: GoogleService-Info.plist
        optional: true
        buildPhase: resources
    dependencies:
      - package: PixelboardCore
        product: PixelboardCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseCrashlytics
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.collapsetechnologies.pixelboard
        PRODUCT_NAME: Infinite Pixelboard
        PIXELBOARD_BASE_URL: https://pixelboard.collapsetechnologies.com
        GOOGLE_REVERSED_CLIENT_ID: com.googleusercontent.apps.241184054384-8342q57a6o5fjlo4cgvhjm5b1vrboc5g
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 7
        MARKETING_VERSION: 1.0.2
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_STRICT_CONCURRENCY: targeted
        CODE_SIGN_ENTITLEMENTS: InfinitePixelboard.entitlements
        DEVELOPMENT_TEAM: 3S529795M9
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Infinite Pixelboard
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.entertainment
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen:
          UIColorName: Paper
        UIUserInterfaceStyle: Light
        UIAppFonts:
          - SpaceGrotesk-Variable.ttf
          - IBMPlexMono-Medium.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        PixelboardBaseURL: "$(PIXELBOARD_BASE_URL)"
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - "$(GOOGLE_REVERSED_CLIENT_ID)"
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - pixelboard
    scheme:
      storeKitConfiguration: Resources/InfinitePixelboard.storekit
      testTargets:
        - PixelboardCoreTests
  PixelboardCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/PixelboardCoreTests
    dependencies:
      - package: PixelboardCore
        product: PixelboardCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.collapsetechnologies.pixelboard.tests
