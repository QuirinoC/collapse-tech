name: InfinitePixelboard
options:
  bundleIdPrefix: com.collapse
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    CODE_SIGN_STYLE: Automatic
packages:
  PixelboardCore:
    path: .
targets:
  InfinitePixelboard:
    type: application
    platform: iOS
    sources:
      - path: Sources/InfinitePixelboardApp
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: PixelboardCore
        product: PixelboardCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.collapse.infinitepixelboard
        PRODUCT_NAME: Infinite Pixelboard
        INFOPLIST_KEY_CFBundleDisplayName: Infinite Pixelboard
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_STRICT_CONCURRENCY: targeted
    scheme:
      testTargets:
        - PixelboardCoreTests
  PixelboardCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/PixelboardCoreTests
    dependencies:
      - package: PixelboardCore
        product: PixelboardCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.collapse.infinitepixelboard.tests
