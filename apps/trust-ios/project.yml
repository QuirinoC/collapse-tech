name: Trust
options:
  bundleIdPrefix: com.collapse
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    CODE_SIGN_STYLE: Automatic
    TRUST_BASE_URL: https://trust.collapsetechnologies.com
  configs:
    Debug:
      TRUST_BASE_URL: http://127.0.0.1:5088
packages:
  TrustCore:
    path: .
targets:
  Trust:
    type: application
    platform: iOS
    sources:
      - path: Sources/TrustApp
      - path: Resources
        buildPhase: resources
        excludes:
          - Trust.storekit
          - Fonts/*.txt
    dependencies:
      - package: TrustCore
        product: TrustCore
      - sdk: AuthenticationServices.framework
      - sdk: MapKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.collapsetechnologies.trust
        PRODUCT_NAME: Trust
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_STRICT_CONCURRENCY: targeted
        CODE_SIGN_ENTITLEMENTS: Trust.entitlements
        DEVELOPMENT_TEAM: 3S529795M9
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Trust Circle uses your location while the app is open so you can see yourself on the map and look at people who share with you. Trust Circle does not sell your location.
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Trust Circle
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - es
          - ja
          - zh-Hans
          - de
          - fr
          - ko
          - pt-BR
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.lifestyle
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen:
          UIColorName: Paper
        UIUserInterfaceStyle: Light
        UIAppFonts:
          - SpaceGrotesk-Variable.ttf
          - IBMPlexMono-Medium.ttf
        TRUST_BASE_URL: $(TRUST_BASE_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
            "127.0.0.1":
              NSExceptionAllowsInsecureHTTPLoads: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - location
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: Trust Circle uses your location while the app is open so you can see yourself on the map and look at people who share with you. Trust Circle does not sell your location.
        NSLocationAlwaysAndWhenInUseUsageDescription: Trust Circle holds your location in escrow, including in the background, so a trusted adult peer can find you if they look. They cannot see it until they confirm a look, and you are notified. Trust Circle does not sell your location.
        NSLocationAlwaysUsageDescription: Trust Circle holds your location in escrow, including in the background, so a trusted adult peer can find you if they look. They cannot see it until they confirm a look, and you are notified. Trust Circle does not sell your location.
        NSLocationTemporaryUsageDescriptionDictionary:
          PreciseEscrow: Trust Circle needs precise location so a trusted adult peer can find you if they look. Approximate location is not enough for escrow.
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - trust
    scheme:
      storeKitConfiguration: Resources/Trust.storekit
      testTargets:
        - TrustCoreTests
  TrustCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/TrustCoreTests
    dependencies:
      - package: TrustCore
        product: TrustCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.collapsetechnologies.trust.tests
