// Minimal service-discovery envelope with the real AACS wire tags.
// Other channel types and manufacturer metadata are irrelevant to this test.
syntax="proto2";
package fixture;
import "MediaChannel.proto";
import "MediaStreamType.proto";
import "VideoConfig.proto";
import "AudioConfig.proto";
import "AudioType.proto";

message Channel {
  required uint32 channel_id = 1;
  optional tag.aas.MediaChannel media_channel = 3;
}
message ServiceDiscoveryResponse { repeated Channel channels = 1; }

// This is the old schema's required-field constraint, kept to prove failure
// on the same bytes that the corrected production MediaChannel accepts.
message LegacyMediaChannel {
  required tag.aas.MediaStreamType.Enum media_type = 1;
  optional tag.aas.AudioType.Enum audio_type = 2;
  repeated tag.aas.AudioConfig audio_configs = 3;
  repeated tag.aas.VideoConfig video_configs = 4;
}
message LegacyChannel {
  required uint32 channel_id = 1;
  optional LegacyMediaChannel media_channel = 3;
}
message LegacyServiceDiscoveryResponse { repeated LegacyChannel channels = 1; }
