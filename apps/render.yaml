# Collapse Technologies — Render Blueprint
# Apply from Render Dashboard → collapse-tech project → New → Blueprint
# or via CLI: render blueprints validate apps/render.yaml
services:
  - type: web
    name: infinite-pixelboard
    runtime: docker
    dockerfilePath: ./apps/infinite-pixelboard/Dockerfile
    dockerContext: ./apps/infinite-pixelboard
    plan: starter
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: FORWARDEDHEADERS__TRUSTPLATFORMPROXY
        value: "true" # Render's ingress is the platform proxy; needed for correct client IPs
      - key: REDISCONNECTIONSTRING
        sync: false # set to the Key Value internal hostname in host:port form (e.g. red-xxxx:6379).
                    # StackExchange.Redis does not parse redis:// URIs — do NOT paste Render's
                    # "redis://..." connection URL; use host:port only.
      - key: Firebase__Enabled
        value: "true"
      - key: Firebase__ProjectId
        sync: false # moderator claims are provisioned offline; never add Admin SDK credentials here
      - key: Postgres__Enabled
        value: "true"
      - key: Postgres__ConnectionString
        sync: false # least-privilege runtime role; provision with --provision-postgres first

  - type: web
    name: trust-api
    runtime: docker
    dockerfilePath: ./apps/trust-api/Dockerfile
    dockerContext: ./apps/trust-api
    plan: starter
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: FORWARDEDHEADERS__TRUSTPLATFORMPROXY
        value: "true"
      - key: Trust__Store
        value: postgres
      - key: Trust__SeedReviewCircle
        value: "true"
      - key: StoreKit__Enabled
        value: "true"
      - key: StoreKit__AllowReviewUnlock
        value: "true"
      - key: StoreKit__BundleId
        value: com.collapsetechnologies.trust
      - key: StoreKit__MonthlyProductId
        value: com.collapsetechnologies.trust.circle.monthly
      - key: StoreKit__AnnualProductId
        value: com.collapsetechnologies.trust.circle.annual
      - key: StoreKit__AllowedEnvironments__0
        value: Production
      - key: StoreKit__AllowedEnvironments__1
        value: Sandbox
      - key: Apple__BundleId
        value: com.collapsetechnologies.trust
      - key: Auth__Audience
        value: com.collapsetechnologies.trust
      - key: Auth__AllowDevelopmentSignIn
        value: "false"
      - key: Auth__SigningKey
        generateValue: true
      - key: ConnectionStrings__Postgres
        fromDatabase:
          name: trust-postgres
          property: connectionString
      - key: Apns__Enabled
        value: "false"
      - key: Apns__TeamId
        value: "3S529795M9"
      - key: Apns__BundleId
        value: com.collapsetechnologies.trust
      - key: Apns__KeyId
        sync: false
      - key: Apns__PrivateKey
        sync: false
      - key: Twilio__AccountSid
        sync: false
      - key: Twilio__AuthToken
        sync: false
      - key: Twilio__FromNumber
        sync: false
      - key: Twilio__MessagingServiceSid
        sync: false

databases:
  - name: trust-postgres
    plan: basic-256mb
    databaseName: trust
    user: trust
